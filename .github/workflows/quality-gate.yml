name: Mosala Quality Gate

on:
  push:
    branches:
      - main
      - master
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  security-events: write

jobs:
  frontend-quality:
    name: Frontend Quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type Check
        run: npm run type-check

      - name: Build
        run: npm run build

  api-quality:
    name: API Quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install
        run: npm ci

      - name: Build API
        run: npm run build

  sonar-frontend:
    name: Sonar Frontend
    runs-on: ubuntu-latest
    needs: frontend-quality
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check Sonar config
        id: sonar_config
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
        run: |
          if [ -n "$SONAR_TOKEN" ] && [ -n "$SONAR_HOST_URL" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: SonarQube Scan Frontend
        if: ${{ steps.sonar_config.outputs.enabled == 'true' }}
        uses: SonarSource/sonarqube-scan-action@v7.0.0
        with:
          projectBaseDir: frontend
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}

      - name: SonarQube Quality Gate Frontend
        if: ${{ steps.sonar_config.outputs.enabled == 'true' }}
        uses: SonarSource/sonarqube-quality-gate-action@master
        with:
          pollingTimeoutSec: 600
          scanMetadataReportFile: frontend/.scannerwork/report-task.txt
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}

      - name: Skip Sonar Frontend
        if: ${{ steps.sonar_config.outputs.enabled != 'true' }}
        run: echo "SONAR_TOKEN or SONAR_HOST_URL is not configured; skipping Sonar frontend scan."

  sonar-api:
    name: Sonar API
    runs-on: ubuntu-latest
    needs: api-quality
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check Sonar config
        id: sonar_config
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
        run: |
          if [ -n "$SONAR_TOKEN" ] && [ -n "$SONAR_HOST_URL" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: SonarQube Scan API
        if: ${{ steps.sonar_config.outputs.enabled == 'true' }}
        uses: SonarSource/sonarqube-scan-action@v7.0.0
        with:
          projectBaseDir: backend
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}

      - name: SonarQube Quality Gate API
        if: ${{ steps.sonar_config.outputs.enabled == 'true' }}
        uses: SonarSource/sonarqube-quality-gate-action@master
        with:
          pollingTimeoutSec: 600
          scanMetadataReportFile: backend/.scannerwork/report-task.txt
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}

      - name: Skip Sonar API
        if: ${{ steps.sonar_config.outputs.enabled != 'true' }}
        run: echo "SONAR_TOKEN or SONAR_HOST_URL is not configured; skipping Sonar API scan."

  snyk-frontend:
    name: Snyk Frontend
    runs-on: ubuntu-latest
    needs: frontend-quality
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Check Snyk config
        id: snyk_config
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          if [ -n "$SNYK_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Snyk Frontend
        if: ${{ steps.snyk_config.outputs.enabled == 'true' }}
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high --sarif-file-output=snyk-frontend.sarif

      - name: Upload Frontend SARIF
        if: ${{ always() && steps.snyk_config.outputs.enabled == 'true' }}
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: frontend/snyk-frontend.sarif

      - name: Skip Snyk Frontend
        if: ${{ steps.snyk_config.outputs.enabled != 'true' }}
        run: echo "SNYK_TOKEN is not configured; skipping Snyk frontend scan."

  snyk-api:
    name: Snyk API
    runs-on: ubuntu-latest
    needs: api-quality
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install
        run: npm ci

      - name: Check Snyk config
        id: snyk_config
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          if [ -n "$SNYK_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Snyk API
        if: ${{ steps.snyk_config.outputs.enabled == 'true' }}
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high --sarif-file-output=snyk-api.sarif

      - name: Upload API SARIF
        if: ${{ always() && steps.snyk_config.outputs.enabled == 'true' }}
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: backend/snyk-api.sarif

      - name: Skip Snyk API
        if: ${{ steps.snyk_config.outputs.enabled != 'true' }}
        run: echo "SNYK_TOKEN is not configured; skipping Snyk API scan."
