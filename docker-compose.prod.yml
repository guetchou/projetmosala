version: '3.8'

services:
  # Traefik - Reverse Proxy
  traefik:
    image: traefik:v2.10
    container_name: mosala-traefik
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080" # Dashboard Traefik
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/acme.json:/acme.json
      - ./traefik/logs:/var/log/traefik
    networks:
      - mosala-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traefik-dashboard.rule=Host(`traefik.projetmosala.org`)"
      - "traefik.http.routers.traefik-dashboard.service=api@internal"
      - "traefik.http.routers.traefik-dashboard.entrypoints=websecure"
      - "traefik.http.routers.traefik-dashboard.tls.certresolver=letsencrypt"

  # Frontend - React App
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mosala-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:1199:80"
    depends_on:
      - backend-nestjs
    networks:
      - mosala-net
    environment:
      - NODE_ENV=production
      - VITE_API_URL=https://api.projetmosala.org
      - VITE_CMS_URL=https://cms.projetmosala.org
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`projetmosala.org`)"
      - "traefik.http.routers.frontend.entrypoints=websecure"
      - "traefik.http.routers.frontend.tls.certresolver=letsencrypt"
      - "traefik.http.services.frontend.loadbalancer.server.port=80"
      - "traefik.http.routers.frontend-www.rule=Host(`www.projetmosala.org`)"
      - "traefik.http.routers.frontend-www.entrypoints=websecure"
      - "traefik.http.routers.frontend-www.tls.certresolver=letsencrypt"
      - "traefik.http.services.frontend-www.loadbalancer.server.port=80"

  # Backend NestJS
  backend-nestjs:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mosala-backend-nestjs
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - DB_HOST=trrckbytehrhtuatzffg.supabase.co
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=5gjLc12W6cxyTsQP
      - DB_NAME=postgres
      - JWT_SECRET=${JWT_SECRET:-your-super-secret-jwt-key}
      - PORT=4002
      - CORS_ORIGIN=https://projetmosala.org
    depends_on:
      - postgres
    networks:
      - mosala-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend.rule=Host(`api.projetmosala.org`)"
      - "traefik.http.routers.backend.entrypoints=websecure"
      - "traefik.http.routers.backend.tls.certresolver=letsencrypt"
      - "traefik.http.services.backend.loadbalancer.server.port=4002"

  # Strapi CMS
  strapi:
    build:
      context: ./mosala-cms
      dockerfile: Dockerfile
    container_name: mosala-strapi
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - DATABASE_CLIENT=mysql
      - DATABASE_HOST=db
      - DATABASE_PORT=3306
      - DATABASE_NAME=mosala
      - DATABASE_USERNAME=mosala
      - DATABASE_PASSWORD=mosala
      - JWT_SECRET=${STRAPI_JWT_SECRET:-strapi-jwt-secret}
      - ADMIN_JWT_SECRET=${STRAPI_ADMIN_JWT_SECRET:-strapi-admin-jwt-secret}
      - APP_KEYS=${STRAPI_APP_KEYS:-key1,key2,key3,key4}
      - API_TOKEN_SALT=${STRAPI_API_TOKEN_SALT:-salt}
      - TRANSFER_TOKEN_SALT=${STRAPI_TRANSFER_TOKEN_SALT:-salt}
      - CORS_ORIGIN=https://projetmosala.org
    depends_on:
      - db
    networks:
      - mosala-net
    volumes:
      - strapi_data:/app/public/uploads
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.strapi.rule=Host(`cms.projetmosala.org`)"
      - "traefik.http.routers.strapi.entrypoints=websecure"
      - "traefik.http.routers.strapi.tls.certresolver=letsencrypt"
      - "traefik.http.services.strapi.loadbalancer.server.port=1337"

  # Support/Admin Panel
  admin:
    build:
      context: ./frontend
      dockerfile: Dockerfile.admin
    container_name: mosala-admin
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - VITE_API_URL=https://api.projetmosala.org
      - VITE_CMS_URL=https://cms.projetmosala.org
    networks:
      - mosala-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.admin.rule=Host(`admin.projetmosala.org`)"
      - "traefik.http.routers.admin.entrypoints=websecure"
      - "traefik.http.routers.admin.tls.certresolver=letsencrypt"
      - "traefik.http.services.admin.loadbalancer.server.port=80"
      - "traefik.http.routers.support.rule=Host(`support.projetmosala.org`)"
      - "traefik.http.routers.support.entrypoints=websecure"
      - "traefik.http.routers.support.tls.certresolver=letsencrypt"
      - "traefik.http.services.support.loadbalancer.server.port=80"

  # Database MySQL
  db:
    image: mysql:8.0
    container_name: mosala-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: mosala
      MYSQL_USER: mosala
      MYSQL_PASSWORD: mosala
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    ports:
      - "3326:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./backup:/backup
    networks:
      - mosala-net
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Database PostgreSQL
  postgres:
    image: postgres:15
    container_name: mosala-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mosala
    ports:
      - "5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./backup:/backup
    networks:
      - mosala-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  db_data:
  pg_data:
  strapi_data:

networks:
  mosala-net:
    driver: bridge
